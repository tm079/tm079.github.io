name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build lại mỗi ngày lúc 00:00 UTC (7h sáng giờ VN) để kéo bài mới từ các repo write-up
  schedule:
    - cron: '0 0 * * *'
  # Nút "Run workflow" trong tab Actions: cập nhật ngay không cần chờ
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Dùng `npm install` thay vì `npm ci`: lockfile tạo bằng npm cũ trên Windows hay thiếu
      # vài gói phụ (@emnapi/*), `npm ci` sẽ từ chối cài còn `npm install` tự bổ sung.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
